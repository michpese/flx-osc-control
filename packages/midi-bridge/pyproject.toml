[project]
name = "midi-bridge"
version = "0.1.0"
description = "Übersetzt MIDI-Noten in OSC-Befehle für das FLX S24"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zeros-osc",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "PyYAML>=6.0",
]

[project.scripts]
midi-bridge = "midi_bridge.cli:main"

[tool.uv.sources]
zeros-osc = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
